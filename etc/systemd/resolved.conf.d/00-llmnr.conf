[Resolve]
# LLMNR is link-local name resolution with no authentication: any host on the
# LAN can answer a query and spoof a name (the classic responder attack). This
# host resolves through DNS, and mDNS stays available where it is needed, so
# LLMNR is off. Closes UDP/TCP 5355.
#
# Installed by scripts/system/install-resolved-hardening.sh; MulticastDNS is
# deliberately left at its default.
LLMNR=no