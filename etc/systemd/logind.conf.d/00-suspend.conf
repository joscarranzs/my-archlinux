[Login]
# logind does not act on the lid: the Hyprland switch bind owns lid close and
# runs scripts/session/lock-and-suspend.sh (lock -> wait for the lock surface's
# marker -> suspend). logind suspending on its own freezes user.slice before
# anything can lock, which is what made the desktop flash on every resume.
# The suspend key and idle action stay off; manual `systemctl suspend` works
# (route it through lock-and-suspend.sh to lock first).
SleepOperation=suspend
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
IdleAction=ignore
