general {
    # hypridle v0.1.8 runs every command through `/bin/sh -c`, so $HOME is
    # expanded at runtime: keep the paths portable. Point at the stable
    # ~/.scripts symlink so the lock flow survives a move of the repository.
    lock_cmd = $HOME/.scripts/session/lockscreen.sh
    unlock_cmd =
    after_sleep_cmd =
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# logind ignores the lid and the suspend key (etc/systemd/logind.conf.d/
# 00-suspend.conf): the Hyprland switch bind owns lid close and runs
# lock-and-suspend.sh (lock -> marker -> suspend). hypridle itself only locks
# on idle; it never sleeps the machine.
listener {
    timeout = 540
    on-timeout = loginctl lock-session
    condition_cmd = $HOME/.scripts/session/on-battery.sh
}

# Lock after 24 min on AC
listener {
    timeout = 1440
    on-timeout = loginctl lock-session
}
