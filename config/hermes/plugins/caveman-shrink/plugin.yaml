name: caveman-shrink
label: Caveman Shrink
kind: standalone
version: 0.1.1
author: joscarranzs
description: >
  Deterministic output compressor for the terminal tool. Rewrites noisy
  log/table/test/JSON output into a summary before the model reads it, via the
  transform_terminal_output hook. Keeps payload verbatim (error lines, paths,
  tracebacks, counts) and fails open: anything unrecognised, ambiguous or
  barely smaller passes through untouched.
requires_hermes: ">=0.23"
provides_tools: []
provides_hooks:
  - transform_terminal_output
