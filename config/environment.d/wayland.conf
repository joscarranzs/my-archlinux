# Wayland environment for everything the systemd user manager starts: portals,
# user services and apps launched through desktop entries.
#
# Hyprland does not read environment.d, and systemd does not read hl.env(), so
# the same values are declared in config/hypr/hyprland.lua and
# config/hypr/monitors.lua (for processes Hyprland spawns itself). Keep both
# sides in sync.
#
# Takes effect on the next login: the user manager reads these files once, at
# startup.

# Native Wayland backends keep text crisp under fractional scaling.
GDK_BACKEND=wayland
QT_QPA_PLATFORM=wayland
ELECTRON_OZONE_PLATFORM_HINT=auto
MOZ_ENABLE_WAYLAND=1

# GTK must not scale on top of the compositor scale.
GDK_SCALE=1
GDK_DPI_SCALE=1

# Use the GTK platform theme for Qt applications.
QT_QPA_PLATFORMTHEME=gtk2
